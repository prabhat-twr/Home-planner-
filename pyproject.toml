[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soulhome"
version = "0.1.0"
description = "Scan-to-spatial-model reconstruction pipeline (LiDAR / ARCore depth / panorama fallback) for a Vastu & Feng Shui rule engine"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
  "shapely>=2.0",
  "trimesh>=4.0",
  "fast_simplification>=0.1.7",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "pillow>=10",
]

[project.optional-dependencies]
ml = ["torch>=2.6", "torchvision>=0.21", "transformers>=4.45", "ultralytics>=8.3", "huggingface_hub>=0.25"]
usd = ["usd-core>=24.0"]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.29", "modal>=1.0"]

[tool.setuptools.packages.find]
include = ["soulhome*"]

[tool.setuptools.package-data]
soulhome = ["service/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
